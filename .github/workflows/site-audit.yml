name: Website audit

on:
  workflow_dispatch:
    inputs:
      target_url:
        description: "Public website URL to audit (HTTP or HTTPS)"
        required: true
        type: string
      viewport_profile:
        description: "Viewport configuration"
        required: true
        type: choice
        options:
          - matrix
          - desktop
          - mobile
        default: matrix
      report_format:
        description: "Report file format"
        required: true
        type: choice
        options:
          - html
          - markdown
          - json
        default: html
      capture_screenshots:
        description: "Capture viewport screenshots as report artifacts"
        required: true
        type: boolean
        default: false
      ai_visual_review:
        description: "Send public-site screenshots to Gemini for optional visual critique"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  audit:
    name: Audit website
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install dependencies
        run: npm install
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run website audit
        id: run_audit
        continue-on-error: true
        env:
          TARGET_URL: ${{ inputs.target_url }}
          VIEWPORT_PROFILE: ${{ inputs.viewport_profile }}
          REPORT_FORMAT: ${{ inputs.report_format }}
          CAPTURE_SCREENSHOTS: ${{ inputs.capture_screenshots }}
          AI_VISUAL_REVIEW: ${{ inputs.ai_visual_review }}
          GEMINI_API_KEY: ${{ inputs.ai_visual_review && secrets.GEMINI_API_KEY || '' }}
          GEMINI_VISION_MODEL: ${{ vars.GEMINI_VISION_MODEL }}
        run: |
          set -euo pipefail

          case "$TARGET_URL" in
            http://*|https://*) ;;
            *)
              echo "The target must start with http:// or https://"
              exit 2
              ;;
          esac

          case "$REPORT_FORMAT" in
            html) extension="html" ;;
            markdown) extension="md" ;;
            json) extension="json" ;;
            *)
              echo "Unsupported report format"
              exit 2
              ;;
          esac

          args=()
          case "$VIEWPORT_PROFILE" in
            matrix) args+=(--matrix) ;;
            mobile) args+=(--mobile) ;;
            desktop) ;;
            *)
              echo "Unsupported viewport profile"
              exit 2
              ;;
          esac

          if [[ "$CAPTURE_SCREENSHOTS" == "true" ]]; then
            args+=(--screenshots=reports/screenshots)
          fi

          if [[ "$AI_VISUAL_REVIEW" == "true" ]]; then
            if [[ "$CAPTURE_SCREENSHOTS" != "true" || "$VIEWPORT_PROFILE" != "matrix" ]]; then
              echo "AI visual review requires screenshot capture and the matrix viewport profile."
              exit 2
            fi
            if [[ -z "\${GEMINI_API_KEY:-}" ]]; then
              echo "AI visual review was requested, but the GEMINI_API_KEY repository secret is not configured."
              exit 2
            fi
            args+=(--ai-visual-review)
          fi

          npm run audit -- "$TARGET_URL" "${args[@]}" \
            "--format=$REPORT_FORMAT" \
            "--output=reports/jb-expert-qa-report.$extension"
      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: jb-expert-qa-report
          path: reports/
          archive: false
          if-no-files-found: error
          retention-days: 7
      - name: Mark audit result
        if: steps.run_audit.outcome == 'failure'
        run: |
          echo "The report was generated, but the audit did not meet the configured approval criteria."
          exit 1
