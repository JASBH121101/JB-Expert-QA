name: Website audit

on:
  workflow_dispatch:
    inputs:
      target_url:
        description: "Public website URL to audit (HTTP or HTTPS)"
        required: true
        type: string
      viewport_profile:
        description: "Viewport configuration"
        required: true
        type: choice
        options:
          - matrix
          - desktop
          - mobile
        default: matrix
      report_format:
        description: "Report file format"
        required: true
        type: choice
        options:
          - html
          - markdown
          - json
        default: html
      capture_screenshots:
        description: "Capture viewport screenshots as report artifacts"
        required: true
        type: boolean
        default: false
      ai_visual_review:
        description: "Use AI for a deliberate, high-value visual review (Gemini primary; Cloudflare fallback)"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: jb-expert-qa-site-audit
  cancel-in-progress: false

jobs:
  audit:
    name: Audit website
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Get UTC quota day
        id: quota_day
        run: echo "day=$(date -u +%F)" >> "$GITHUB_OUTPUT"
      - name: Restore daily AI quota circuit breaker
        id: ai_quota_cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: .jbqa-ai-quota
          key: jbqa-ai-quota-${{ steps.quota_day.outputs.day }}
      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Audit resolved dependency tree for high and critical vulnerabilities
        run: npm audit --audit-level=high
      - name: Install Chromium
        run: ./node_modules/.bin/playwright install --with-deps chromium
      - name: Run website audit
        id: run_audit
        continue-on-error: true
        env:
          TARGET_URL: ${{ inputs.target_url }}
          VIEWPORT_PROFILE: ${{ inputs.viewport_profile }}
          REPORT_FORMAT: ${{ inputs.report_format }}
          CAPTURE_SCREENSHOTS: ${{ inputs.capture_screenshots }}
          AI_VISUAL_REVIEW: ${{ inputs.ai_visual_review }}
          JBQA_AI_ENABLED: ${{ inputs.ai_visual_review && 'true' || 'false' }}
          GEMINI_API_KEY: ${{ inputs.ai_visual_review && secrets.GEMINI_API_KEY || '' }}
          GEMINI_VISION_MODEL: ${{ vars.GEMINI_VISION_MODEL }}
          CLOUDFLARE_ACCOUNT_ID: ${{ inputs.ai_visual_review && secrets.CLOUDFLARE_ACCOUNT_ID || '' }}
          CLOUDFLARE_API_TOKEN: ${{ inputs.ai_visual_review && secrets.CLOUDFLARE_API_TOKEN || '' }}
          CLOUDFLARE_FREE_TIER_CONFIRMED: ${{ vars.CLOUDFLARE_FREE_TIER_CONFIRMED }}
          CLOUDFLARE_MAX_REQUESTS_PER_RUN: "4"
          JBQA_AI_QUOTA_STATE_PATH: ${{ github.workspace }}/.jbqa-ai-quota/provider-quota.json
        run: |
          set -euo pipefail

          case "$TARGET_URL" in
            http://*|https://*) ;;
            *)
              echo "The target must start with http:// or https://"
              exit 2
              ;;
          esac

          case "$REPORT_FORMAT" in
            html) extension="html" ;;
            markdown) extension="md" ;;
            json) extension="json" ;;
            *)
              echo "Unsupported report format"
              exit 2
              ;;
          esac

          args=()
          case "$VIEWPORT_PROFILE" in
            matrix) args+=(--matrix) ;;
            mobile) args+=(--mobile) ;;
            desktop) ;;
            *)
              echo "Unsupported viewport profile"
              exit 2
              ;;
          esac

          if [[ "$CAPTURE_SCREENSHOTS" == "true" ]]; then
            args+=(--screenshots=reports/screenshots)
          fi

          if [[ "$AI_VISUAL_REVIEW" == "true" ]]; then
            if [[ "$CAPTURE_SCREENSHOTS" != "true" || "$VIEWPORT_PROFILE" != "matrix" ]]; then
              echo "AI visual review requires screenshot capture and the matrix viewport profile."
              exit 2
            fi
            cf_ready=false
            if [[ -n "${CLOUDFLARE_ACCOUNT_ID:-}" && -n "${CLOUDFLARE_API_TOKEN:-}" && "${CLOUDFLARE_FREE_TIER_CONFIRMED:-}" == "true" ]]; then
              cf_ready=true
            fi
            if [[ -z "${GEMINI_API_KEY:-}" && "$cf_ready" != "true" ]]; then
              echo "AI visual review requires Gemini credentials or Cloudflare credentials with the Free-tier confirmation."
              exit 2
            fi
            args+=(--ai-visual-review)
          fi

          npm run audit -- "$TARGET_URL" "${args[@]}" \
            "--format=$REPORT_FORMAT" \
            "--output=reports/jb-expert-qa-report.$extension"
      - name: Persist daily AI quota circuit breaker
        if: always() && steps.ai_quota_cache.outputs.cache-hit != 'true' && hashFiles('.jbqa-ai-quota/provider-quota.json') != ''
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: .jbqa-ai-quota
          key: jbqa-ai-quota-${{ steps.quota_day.outputs.day }}
      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: jb-expert-qa-report
          path: reports/
          if-no-files-found: error
          retention-days: 7
      - name: Mark audit result
        if: steps.run_audit.outcome == 'failure'
        run: |
          echo "The report was generated, but the audit did not meet the configured approval criteria."
          exit 1
