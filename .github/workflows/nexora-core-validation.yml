name: NEXORA Core PHP validation

on:
  push:
    branches: ["feature/nexora-core-ci", "feature/nexora-library-engine"]
    paths:
      - "engines/nexora/application/**"
      - ".github/workflows/nexora-core-validation.yml"
  pull_request:
    branches: ["NEXORA-Core"]
    paths:
      - "engines/nexora/application/**"
      - ".github/workflows/nexora-core-validation.yml"

permissions:
  contents: read

concurrency:
  group: nexora-core-php-${{ github.ref }}
  cancel-in-progress: true

jobs:
  laravel:
    name: NEXORA Core · PHP 8.3 / SQLite + PostgreSQL 16
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: nexora_core
          POSTGRES_USER: nexora_core
          POSTGRES_PASSWORD: nexora_core_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nexora_core -d nexora_core"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: engines/nexora/application
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false

      - name: Set up PHP 8.3
        uses: shivammathur/setup-php@0f7f1d08e3e32076e51cae65eb0b0c871405b16e
        with:
          php-version: "8.3"
          extensions: bcmath, curl, dom, fileinfo, intl, mbstring, openssl, pdo_pgsql, pdo_sqlite, xml, zip
          coverage: none
          tools: composer:v2

      - name: Validate Composer manifest and lockfile
        run: composer validate --strict

      - name: Install locked dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare isolated Laravel test environment
        run: |
          if [ ! -f .env ]; then cp .env.example .env; fi
          php artisan key:generate --force

      - name: Verify Laravel coding style
        env:
          COLUMNS: 200
        run: composer lint

      - name: Run tests on SQLite
        run: composer test

      - name: Run tests on PostgreSQL 16
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: nexora_core
          DB_USERNAME: nexora_core
          DB_PASSWORD: nexora_core_ci
          DB_URL: ""
        run: composer test
