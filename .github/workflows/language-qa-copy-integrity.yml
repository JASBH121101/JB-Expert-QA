name: Language QA text encoding integrity

on:
  pull_request:
    branches: [main]
    paths:
      - "src/language/semantic-audit.js"
      - "src/language/audit.js"
      - "src/specialists/language/index.js"
      - "tests/language-qa-corrupt-copy-signals.test.js"
      - ".github/workflows/language-qa-copy-integrity.yml"
  push:
    branches: [main, "feature/language-qa-corrupt-copy-signals-v1"]
    paths:
      - "src/language/semantic-audit.js"
      - "src/language/audit.js"
      - "src/specialists/language/index.js"
      - "tests/language-qa-corrupt-copy-signals.test.js"
      - ".github/workflows/language-qa-copy-integrity.yml"

permissions:
  contents: read

jobs:
  text-integrity-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22
          package-manager-cache: false
      - run: node --test tests/language-qa-corrupt-copy-signals.test.js tests/language-qa-engine.test.js
