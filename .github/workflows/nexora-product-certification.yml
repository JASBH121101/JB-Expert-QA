name: NEXORA Product Profiles Certification

on:
  pull_request:
    branches: [integration/jb-threat-lab]
    paths:
      - "packages/threat-lab/integrations/nexora/**"
      - ".github/workflows/nexora-product-certification.yml"
      - "docs/JB-THREAT-LAB.md"
      - "packages/threat-lab/README.md"
  push:
    branches: [integration/jb-threat-lab]
    paths:
      - "packages/threat-lab/integrations/nexora/**"
      - ".github/workflows/nexora-product-certification.yml"
      - "docs/JB-THREAT-LAB.md"
      - "packages/threat-lab/README.md"

permissions:
  contents: read

concurrency:
  group: nexora-product-certification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  configurable-catalog:
    name: NEXORA Configurable Catalog · Node.js 22
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout JB Threat Lab
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false

      - name: Checkout NEXORA configurable-catalog branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: JASBH121101/Nexora
          ref: feature/nexora-configurable-catalog
          path: .test-targets/nexora-configurable-catalog
          persist-credentials: false

      - name: Set up Node.js 22
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 22
          package-manager-cache: false

      - name: Record checked-out target revision
        id: target
        shell: bash
        run: echo "sha=$(git -C .test-targets/nexora-configurable-catalog rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Run real NEXORA prototype scenarios through Threat Lab
        env:
          NEXORA_CONFIGURABLE_CATALOG_ROOT: ${{ github.workspace }}/.test-targets/nexora-configurable-catalog
          NEXORA_CONFIGURABLE_CATALOG_SHA: ${{ steps.target.outputs.sha }}
        run: node --test packages/threat-lab/integrations/nexora/configurable-catalog.mjs

  site-engine:
    name: NEXORA Site Engine · PHP 8.3 and SQLite
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout JB Threat Lab
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false

      - name: Checkout NEXORA Site Engine branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: JASBH121101/Nexora
          ref: feature/nexora-site-engine-certification
          path: .test-targets/nexora-site-engine
          persist-credentials: false

      - name: Set up PHP 8.3
        uses: shivammathur/setup-php@0f7f1d08e3e32076e51cae65eb0b0c871405b16e
        with:
          php-version: "8.3"
          extensions: bcmath, curl, dom, fileinfo, intl, mbstring, openssl, pdo_sqlite, xml, zip
          coverage: none
          tools: composer:v2

      - name: Install Laravel dependencies
        working-directory: .test-targets/nexora-site-engine
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare isolated test configuration
        working-directory: .test-targets/nexora-site-engine
        run: |
          if [ ! -f .env ]; then cp .env.example .env; fi
          php artisan key:generate --force

      - name: Set up Node.js 22
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 22
          package-manager-cache: false

      - name: Record checked-out target revision
        id: target
        shell: bash
        run: echo "sha=$(git -C .test-targets/nexora-site-engine rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Run six-tier NEXORA Site Engine scenarios through Threat Lab
        env:
          NEXORA_SITE_ENGINE_ROOT: ${{ github.workspace }}/.test-targets/nexora-site-engine
          NEXORA_SITE_ENGINE_SHA: ${{ steps.target.outputs.sha }}
          APP_ENV: testing
          APP_KEY: "base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA="
          DB_CONNECTION: sqlite
          DB_DATABASE: ":memory:"
          DB_URL: ""
          MAIL_MAILER: array
          CACHE_STORE: array
          QUEUE_CONNECTION: sync
          SESSION_DRIVER: array
          SESSION_ENCRYPT: "false"
        run: node --test packages/threat-lab/integrations/nexora/site-engine.mjs
