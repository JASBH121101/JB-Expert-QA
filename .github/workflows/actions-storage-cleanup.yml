name: JB Expert QA Actions storage cleanup

on:
  schedule:
    - cron: "35 5 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/actions-storage-cleanup.yml"
      - ".github/workflows/benchmark-security-qa.yml"
      - ".github/workflows/benchmark-security-guard.yml"
      - ".github/workflows/malware-engine-validation.yml"
      - ".github/workflows/engine-certification.yml"
      - ".github/workflows/core-validation.yml"
      - ".github/workflows/security-validation.yml"
      - ".github/workflows/sccm-validation.yml"
      - ".github/workflows/nexora-product-certification.yml"

permissions:
  actions: write

concurrency:
  group: jb-expert-qa-actions-storage-cleanup
  cancel-in-progress: false

jobs:
  prune-report-artifacts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Delete only project QA and certification evidence older than seven days
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          cutoff="$(date -u -d '7 days ago' +'%Y-%m-%dT%H:%M:%SZ')"
          echo "Deleting only listed JB Expert QA report artifacts older than ${cutoff}."
          artifact_ids="$(CUTOFF="${cutoff}" gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100" \
            --jq '.artifacts[]
              | select(.name | test("^(expert-qa-security-node-|language-qa-benchmark-|jb-threat-lab-unified-certification-|malware-engine-benchmark$|malware-engine-benchmark-|malware-engine-calibration-|resilience-service-manager-lab-|expert-qa-service-deployment-profile-|jb-sccm-report-node-|expert-qa-benchmark-|security-guard-benchmark-|jb-expert-qa-report$|security-sbom-node-|jb-expert-qa-autonomous-independence-node-|nexora-threat-lab-certification-reports$)")
              | select(.created_at < env.CUTOFF)
              | .id')"
          deleted=0
          if [[ -n "${artifact_ids}" ]]; then
            while IFS= read -r artifact_id; do
              [[ -n "${artifact_id}" ]] || continue
              gh api --method DELETE "repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}" >/dev/null
              deleted=$((deleted + 1))
            done <<< "${artifact_ids}"
          fi
          echo "Removed ${deleted} matching report artifact(s). APKs, releases and unrelated artifacts are excluded."
          echo "### Actions storage cleanup" >> "${GITHUB_STEP_SUMMARY}"
          echo "- Cutoff: ${cutoff}" >> "${GITHUB_STEP_SUMMARY}"
          echo "- Deleted report artifacts: ${deleted}" >> "${GITHUB_STEP_SUMMARY}"
