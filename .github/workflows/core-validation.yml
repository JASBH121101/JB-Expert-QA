name: Core validation

on:
  push:
    branches: [main]
    paths:
      - "package.json"
      - "src/**"
      - "tests/**"
      - "config/**"
      - ".github/workflows/**"
  pull_request:
    branches: [main]
    paths:
      - "package.json"
      - "src/**"
      - "tests/**"
      - "config/**"
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: read

# Keep each relevant validation run. Do not cancel a running test when another
# code commit is pushed; GitHub will queue it instead.
concurrency:
  group: core-validation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Node.js tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - name: Install dependencies
        run: npm install
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run syntax checks and tests
        run: npm run check
