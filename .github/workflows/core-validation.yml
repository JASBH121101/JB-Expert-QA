name: Core validation
# Keep browser-state exploration tests in the same validation matrix as static and visual checks.

on:
  push:
    branches: [main, "feature/**", "integration/**"]
    paths:
      - "package.json"
      - "src/**"
      - "packages/**"
      - "tests/**"
      - "config/**"
      - ".github/workflows/**"
  pull_request:
    branches: [main]
    paths:
      - "package.json"
      - "src/**"
      - "packages/**"
      - "tests/**"
      - "config/**"
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: core-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Node.js tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: ${{ matrix.node-version }}
          package-manager-cache: false
      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Audit resolved dependency tree for high and critical vulnerabilities
        run: npm audit --audit-level=high
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run focused dead-export reachability tests
        run: npm run test:dead-code
      - name: Run syntax checks and tests
        run: npm run check
