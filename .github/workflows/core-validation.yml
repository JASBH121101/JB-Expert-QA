name: Core browser validation

on:
  push:
    branches: [main, feature/deep-analysis-cross-engine-upgrade]
    paths:
      - "package.json"
      - "package-lock.json"
      - "src/adapters/playwright/**"
      - "src/adapters/visual/**"
      - "src/specialists/accessibility/**"
      - "src/specialists/responsive/**"
      - "src/specialists/ui-ux/**"
      - "src/specialists/functional/**"
      - "tests/browser-environment.test.js"
      - "tests/playwright-context.test.js"
      - "tests/security-url.browser.test.js"
      - "tests/url-safety.test.js"
      - "tests/integration/**"
      - "config/default.config.json"
      - ".github/workflows/core-validation.yml"
  pull_request:
    branches: [main]
    paths:
      - "package.json"
      - "package-lock.json"
      - "src/adapters/playwright/**"
      - "src/adapters/visual/**"
      - "src/specialists/accessibility/**"
      - "src/specialists/responsive/**"
      - "src/specialists/ui-ux/**"
      - "src/specialists/functional/**"
      - "tests/browser-environment.test.js"
      - "tests/playwright-context.test.js"
      - "tests/security-url.browser.test.js"
      - "tests/url-safety.test.js"
      - "tests/integration/**"
      - "config/default.config.json"
      - ".github/workflows/core-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: core-browser-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser-tests:
    name: Chromium integration tests (Node ${{ matrix.node-version }})
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: ${{ matrix.node-version }}
          package-manager-cache: false
      - name: Cache npm download data
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ matrix.node-version }}-npm-${{ hashFiles('package.json', 'packages/*/package.json') }}
          restore-keys: |
            ${{ runner.os }}-node-${{ matrix.node-version }}-npm-
      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-chromium-1.56.1
      - name: Install dependencies
        run: npm install --prefer-offline --ignore-scripts --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run focused browser integration tests
        run: npm run test:browser
