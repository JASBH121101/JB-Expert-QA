name: Core validation

on:
  push:
    branches: [main]
    paths:
      - "package.json"
      - "src/**"
      - "tests/**"
      - "config/**"
      - ".github/workflows/**"
  pull_request:
    branches: [main]
    paths:
      - "package.json"
      - "src/**"
      - "tests/**"
      - "config/**"
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: core-validation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Node.js tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
          package-manager-cache: false
      - name: Install dependencies
        run: npm install
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run syntax checks and tests
        run: npm run check
