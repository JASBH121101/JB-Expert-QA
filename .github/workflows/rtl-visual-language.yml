name: RTL visual language validation

on:
  pull_request:
    branches: [main]
    paths:
      - "src/adapters/playwright/visual-integrity.js"
      - "src/specialists/ui-ux/layout-integrity.js"
      - "tests/integration/rtl-visual-language.test.js"
      - ".github/workflows/rtl-visual-language.yml"
  push:
    branches: [main, "feature/language-qa-rtl-visual-audit-v1"]
    paths:
      - "src/adapters/playwright/visual-integrity.js"
      - "src/specialists/ui-ux/layout-integrity.js"
      - "tests/integration/rtl-visual-language.test.js"
      - ".github/workflows/rtl-visual-language.yml"

permissions:
  contents: read

jobs:
  rtl-visual-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22
          package-manager-cache: false
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: ./node_modules/.bin/playwright install --with-deps chromium
      - run: node --test tests/integration/rtl-visual-language.test.js
