name: Temporary Block 1 Certification

on:
  push:
    branches:
      - feature/local-certification-runner
    paths:
      - 'scripts/local-certification.mjs'
      - 'tests/local-certification.test.js'
      - 'docs/LOCAL-CERTIFICATION.md'
      - 'package.json'
      - '.github/workflows/block-1-certification.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Runner unit tests
        run: node --test tests/local-certification.test.js
      - name: Core certification
        run: npm run qa:local
      - name: Full certification
        run: npm run qa:local:full
