name: JB Engines Certification

on:
  push:
    branches: [main, "integration/**"]
    paths:
      - "src/**"
      - "tests/**"
      - "packages/**"
      - "scripts/**"
      - "config/**"
      - "docs/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/engine-certification.yml"
  pull_request:
    branches: [main, "integration/**"]
    paths:
      - "src/**"
      - "tests/**"
      - "packages/**"
      - "scripts/**"
      - "config/**"
      - "docs/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/engine-certification.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: engine-certification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  expert-qa:
    name: Expert QA regression / Node ${{ matrix.node }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - name: Install repository dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Install Chromium for browser QA
        # Use runner-provided libraries; avoid APT mirror provisioning stalls.
        run: npx playwright install chromium
      - name: Run full deterministic regression suite
        run: npm run check
      - name: Generate Expert QA security assessment
        id: expert-report
        run: |
          mkdir -p certification-reports
          npm run audit:security -- . --production-only --format=markdown --output=certification-reports/expert-qa-security.md
      - name: Add report status to workflow summary
        if: always()
        run: |
          if [ -f certification-reports/expert-qa-security.md ]; then
            echo "Scope: production source only. Test/fixture files and the security detector rule definitions are excluded from finding evaluation; all tests still run in the regression suite." >> "$GITHUB_STEP_SUMMARY"
            cat certification-reports/expert-qa-security.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Expert QA report was not generated; inspect the preceding step." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload Expert QA report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: expert-qa-security-node-${{ matrix.node }}
          path: certification-reports/
          if-no-files-found: warn
          retention-days: 7

  advisor-engine:
    name: Advisor Engine tests / ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
        node: [22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - name: Install repository dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Run Advisor Engine syntax, domain, evidence and recommendation tests
        run: npm run check --workspace @jb/advisor-engine

  language-qa:
    name: Language QA tests / ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
        node: [22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - name: Install repository dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Check Language QA source syntax
        run: |
          node --check src/language/locale.js
          node --check src/language/placeholders.js
          node --check src/language/php-array-parser.js
          node --check src/language/glossary.js
          node --check src/language/translation-memory.js
          node --check src/language/review.js
          node --check src/language/audit.js
          node --check src/adapters/filesystem/audit-language.js
          node --check src/specialists/language/index.js
          node --check src/language-cli.js
          node --check src/adapters/filesystem/audit-project.js
          node --check src/index.js
      - name: Run Language QA regression tests
        run: node --test tests/language-qa-engine.test.js
      - name: Run deterministic Language QA performance baseline
        env:
          JB_LANGUAGE_QA_BENCH_ITERATIONS: 100
          JB_LANGUAGE_QA_BENCHMARK_OUTPUT_DIR: ${{ runner.temp }}/jb-language-qa-benchmark
        run: npm run benchmark:language-qa
      - name: Upload Language QA benchmark evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: language-qa-benchmark-${{ matrix.os }}-node-${{ matrix.node }}
          path: ${{ runner.temp }}/jb-language-qa-benchmark/
          if-no-files-found: warn
          retention-days: 7

  expert-qa-package-cross-platform:
    name: Expert QA package / ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
        node: [22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - name: Install repository dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Install Chromium for package browser tests
        run: npx playwright install chromium
      - name: Build and test the independently installable Expert QA package
        run: |
          node scripts/build-expert-qa-package.js
          node --test packages/expert-qa/package-tests/complete-engine.spec.js packages/expert-qa/package-tests/browser-audit.spec.js
      - name: Run local process isolation and native resource containment tests
        run: node --test tests/execution-process-runner.test.js tests/windows-job-object-resource-controller.test.js

  threat-lab:
    name: Threat Lab safety and six-tier certification / ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
        node: [22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - name: Install repository dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Run safe local Threat Lab certification matrix
        env:
          JB_THREAT_LAB_REPORT_DIR: ${{ runner.temp }}/jb-threat-lab-source-reports
        run: npm run test:threat-lab
      - name: Build unified Threat Lab certification report
        env:
          JB_THREAT_LAB_REPORT_DIR: ${{ runner.temp }}/jb-threat-lab-source-reports
          JB_THREAT_LAB_CERTIFICATION_OUTPUT: ${{ runner.temp }}/jb-threat-lab-unified-certification-report.v1.json
        run: node scripts/build-threat-lab-certification-report.mjs
      - name: Upload unified multi-engine certification evidence
        if: success()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: jb-threat-lab-unified-certification-${{ matrix.os }}-node-${{ matrix.node }}
          path: |
            ${{ runner.temp }}/jb-threat-lab-unified-certification-report.v1.json
            ${{ runner.temp }}/jb-threat-lab-source-reports/*.json
          if-no-files-found: error
          retention-days: 7

  security-guard:
    name: Security Guard tests / ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
        node: [22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - name: Install repository dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Run Security Guard attack-simulation and regression suite
        run: npm run test:security-guard

  security-guard-php:
    name: Security Guard PHP adapter / PHP 8.2
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Verify PHP runtime
        run: |
          php -v
          php -r 'if (PHP_VERSION_ID < 80200) { fwrite(STDERR, "PHP 8.2 or newer is required.\\n"); exit(1); }'
      - name: Check all PHP package files
        run: find packages/security-guard-php -type f -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Run shared HMAC and PHP adapter tests
        run: php packages/security-guard-php/tests/run.php

  security-guard-python:
    name: Security Guard Python FastAPI adapter / Python 3.11
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Verify Python runtime
        run: |
          python3 --version
          python3 -c 'import sys; assert sys.version_info >= (3, 11), "Python 3.11 or newer is required"'
      - name: Compile Python package
        run: python3 -m compileall -q packages/security-guard-python
      - name: Run shared HMAC, API client and ASGI middleware tests
        env:
          PYTHONPATH: packages/security-guard-python/src
        run: python3 -m unittest discover -s packages/security-guard-python/tests -v

  malware-engine:
    name: Malware Engine tests / ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
        node: [22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - name: Install repository dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Run Malware Engine full suite (including calibration and Guard adapter)
        run: npm --workspace @jb/malware-engine run check
      - name: Run bounded benchmark on Ubuntu / Node 22
        if: matrix.os == 'ubuntu-24.04' && matrix.node == 22
        env:
          BENCH_ITERATIONS: "5"
          BENCH_OUTPUT_DIR: certification-reports/malware-benchmark
        run: npm --workspace @jb/malware-engine run benchmark
      - name: Upload Malware Engine benchmark
        if: always() && matrix.os == 'ubuntu-24.04' && matrix.node == 22
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: malware-engine-benchmark
          path: certification-reports/malware-benchmark/
          if-no-files-found: warn
          retention-days: 7

  resilience-engine:
    name: Resilience Engine tests / ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
        node: [22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - name: Install repository dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Run Resilience Engine policy, recovery and platform-adapter tests
        run: npm --workspace @jb/resilience-engine run test

  integration-contracts:
    name: JB Engine integration contracts / Node ${{ matrix.node }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - name: Install repository dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Run JB Engine contract, compatibility and isolation tests
        run: npm run test:engine-contracts

  package-boundaries:
    name: Five-package distribution boundary / Node ${{ matrix.node }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - name: Install repository dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Verify all seven independently installable packages
        run: npm run test:package-distributions
  resilience-service-manager-live:
    name: Real service manager lab / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
          package-manager-cache: false
      - name: Exercise the real OS service manager through the typed adapter
        env:
          RESILIENCE_LAB_OUTPUT: ${{ runner.temp }}/resilience-service-manager-lab.json
        run: node scripts/resilience-service-manager-lab.mjs
      - name: Upload disposable service-manager certification evidence
        if: success()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: resilience-service-manager-lab-${{ matrix.os }}
          path: ${{ runner.temp }}/resilience-service-manager-lab.json
          if-no-files-found: error
          retention-days: 7

  expert-qa-service-deployment-profile-live:
    name: Expert QA generated host service profile / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
          package-manager-cache: false
      - name: Validate generated profile through the real platform service manager
        env:
          EQA_PROFILE_LAB_OUTPUT: ${{ runner.temp }}/expert-qa-service-deployment-profile-lab.json
        run: node scripts/expert-qa-service-deployment-profile-lab.mjs
      - name: Upload generated service profile lab evidence
        if: success()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: expert-qa-service-deployment-profile-${{ matrix.os }}
          path: ${{ runner.temp }}/expert-qa-service-deployment-profile-lab.json
          if-no-files-found: error
          retention-days: 7

  sccm-registry:
    name: SCCM hierarchy and evidence gates / Node ${{ matrix.node }}
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - name: Install repository dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Validate hierarchy, exact-SHA evidence and certification gates
        run: npm run sccm:check
      - name: Generate hierarchical SCCM report
        run: npm run sccm:report > "${{ runner.temp }}/jb-sccm-report.json"
      - name: Upload SCCM report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: jb-sccm-report-node-${{ matrix.node }}
          path: ${{ runner.temp }}/jb-sccm-report.json
          if-no-files-found: error
          retention-days: 7

  api-testing-engine:
    name: API Testing Engine / ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
        node: [22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - name: Install repository dependencies without lifecycle scripts
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Run API Request Engine checks against ephemeral loopback HTTP fixtures
        run: npm --workspace @jb/api-testing-engine run check
