name: Language QA glossary coverage and performance validation

on:
  pull_request:
    branches: [main]
    paths:
      - "src/language/glossary.js"
      - "tests/language-qa-glossary-performance.test.js"
      - "bench/glossary-matchers.js"
      - ".github/workflows/language-qa-glossary.yml"
  push:
    branches: [main, "feature/language-qa-glossary-performance-v2"]
    paths:
      - "src/language/glossary.js"
      - "tests/language-qa-glossary-performance.test.js"
      - "bench/glossary-matchers.js"
      - ".github/workflows/language-qa-glossary.yml"

permissions:
  contents: read

jobs:
  glossary-tests-and-benchmark:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22
          package-manager-cache: false
      - run: npm run test:language-qa
      - run: npm run benchmark:language-qa -- --iterations=25
