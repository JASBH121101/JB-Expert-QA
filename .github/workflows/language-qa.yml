name: Language QA validation

on:
  push:
    branches: [main, "integration/**", "feature/language-qa-engine", "feature/language-qa-native-acceptance-v1"]
    paths:
      - "package.json"
      - "src/language/**"
      - "src/adapters/filesystem/audit-language.js"
      - "src/adapters/filesystem/audit-project.js"
      - "src/specialists/index.js"
      - "src/specialists/language/**"
      - "src/index.js"
      - "tests/language-qa-engine.test.js"
      - "tests/language-qa-translation-memory-suggestions.test.js"
      - "tests/language-qa-linguistic-signals.test.js"
      - "tests/language-qa-native-acceptance.test.js"
      - "tests/language-qa-contextual-profiles.test.js"
      - "bench/language-qa.js"
      - ".github/workflows/language-qa.yml"
  pull_request:
    branches: [main, "integration/**"]
    paths:
      - "package.json"
      - "src/language/**"
      - "src/adapters/filesystem/audit-language.js"
      - "src/adapters/filesystem/audit-project.js"
      - "src/specialists/index.js"
      - "src/specialists/language/**"
      - "src/index.js"
      - "tests/language-qa-engine.test.js"
      - "tests/language-qa-translation-memory-suggestions.test.js"
      - "tests/language-qa-linguistic-signals.test.js"
      - "tests/language-qa-native-acceptance.test.js"
      - ".github/workflows/language-qa.yml"

permissions:
  contents: read

concurrency:
  group: language-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  language-tests:
    name: Language QA unit tests (Node.js 22)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22
          package-manager-cache: false
      - name: Check Language QA source syntax
        run: |
          node --check src/language/locale.js
          node --check src/language/placeholders.js
          node --check src/language/php-array-parser.js
          node --check src/language/glossary.js
          node --check src/language/translation-memory.js
          node --check src/language/review.js
          node --check src/language/audit.js
          node --check src/language/native-acceptance.js
          node --check src/language/contextual-profiles.js
          node --check src/adapters/filesystem/audit-language.js
          node --check src/specialists/language/index.js
          node --check src/language-cli.js
          node --check src/adapters/filesystem/audit-project.js
          node --check src/index.js
      - name: Run Language QA regression tests
        run: npm run test:language-qa
      - name: Run deterministic Language QA benchmark baseline
        run: npm run benchmark:language-qa -- --iterations=25
