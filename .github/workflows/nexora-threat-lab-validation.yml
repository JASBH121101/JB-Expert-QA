name: NEXORA Threat Lab product validation

on:
  pull_request:
    branches: [main]
    paths:
      - "packages/threat-lab/**"
      - "docs/JB-THREAT-LAB.md"
      - "packages/threat-lab/README.md"
      - ".github/workflows/nexora-threat-lab-validation.yml"
  push:
    branches: [main, "feature/**"]
    paths:
      - "packages/threat-lab/**"
      - "docs/JB-THREAT-LAB.md"
      - "packages/threat-lab/README.md"
      - ".github/workflows/nexora-threat-lab-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nexora-threat-lab-validation-\${{ github.ref }}
  cancel-in-progress: true

jobs:
  configurable-catalog:
    name: NEXORA Configurable Catalog · Node 22
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      NEXORA_CATALOG_ROOT: \${{ github.workspace }}/.test-targets/nexora-catalog
      NEXORA_CATALOG_REVISION: 88c4876c9678b93dadde55f79fe9d04890900741
    steps:
      - name: Checkout JB Threat Lab
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false

      - name: Checkout the pinned NEXORA catalog prototype
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: JASBH121101/Nexora
          ref: 88c4876c9678b93dadde55f79fe9d04890900741
          path: .test-targets/nexora-catalog
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 22
          package-manager-cache: false

      - name: Validate the six-tier catalog product profile
        run: node --test packages/threat-lab/tests/nexora-configurable-catalog.integration.test.js

  site-engine:
    name: NEXORA Site Engine · PHP 8.3 · SQLite and PostgreSQL 16
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: nexora
          POSTGRES_USER: nexora
          POSTGRES_PASSWORD: nexora
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nexora -d nexora"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      NEXORA_SITE_ENGINE_ROOT: \${{ github.workspace }}/.test-targets/nexora-site-engine
      NEXORA_SITE_ENGINE_REVISION: 3f68126ecc58b088c071007c5116bc95426d159b
    steps:
      - name: Checkout JB Threat Lab
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false

      - name: Checkout the canonical approved NEXORA Site Engine revision
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: JASBH121101/Nexora
          ref: 3f68126ecc58b088c071007c5116bc95426d159b
          path: .test-targets/nexora-site-engine
          persist-credentials: false

      - name: Set up PHP 8.3
        uses: shivammathur/setup-php@0f7f1d08e3e32076e51cae65eb0b0c871405b16e
        with:
          php-version: "8.3"
          extensions: bcmath, curl, dom, fileinfo, intl, mbstring, openssl, pdo_pgsql, pdo_sqlite, xml, zip
          coverage: none
          tools: composer:v2

      - name: Install locked Site Engine dependencies
        working-directory: .test-targets/nexora-site-engine
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare disposable Laravel test environment
        working-directory: .test-targets/nexora-site-engine
        run: |
          if [ ! -f .env ]; then cp .env.example .env; fi
          php artisan key:generate --force

      - name: Verify Laravel coding style
        working-directory: .test-targets/nexora-site-engine
        env:
          COLUMNS: 200
        run: composer lint

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 22
          package-manager-cache: false

      - name: Validate the six-tier Site Engine product profile on SQLite
        run: node --test packages/threat-lab/tests/nexora-site-engine.integration.test.js

      - name: Run the complete Site Engine suite on PostgreSQL 16
        working-directory: .test-targets/nexora-site-engine
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: nexora
          DB_USERNAME: nexora
          DB_PASSWORD: nexora
          DB_URL: ""
        run: composer test
