name: JB Security Guard Performance Benchmark

on:
  push:
    branches: [feature/jb-security-guard, "integration/**"]
    paths:
      - "packages/security-guard/**"
      - "bench/**"
      - "package.json"
      - ".github/workflows/benchmark-security-guard.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: benchmark-security-guard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  benchmark:
    name: Upload inspection benchmark
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22
          package-manager-cache: false
      - name: Run benchmark
        env:
          BENCH_ITERATIONS: "10"
          BENCH_OUTPUT_DIR: benchmark-results
        run: node bench/security-guard.js
      - name: Add report to workflow summary
        run: cat benchmark-results/summary.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload benchmark report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: security-guard-benchmark-${{ github.run_number }}
          path: benchmark-results/
          if-no-files-found: error
          retention-days: 7
