name: JB Engines Permanent Benchmark

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "packages/**"
      - "bench/*.js"
      - ".github/workflows/benchmark-security-guard.yml"
      - ".github/workflows/malware-engine-validation.yml"
  pull_request:
    branches: [main]
    paths:
      - "src/**"
      - "packages/**"
      - "bench/*.js"
      - ".github/workflows/benchmark-security-guard.yml"
      - ".github/workflows/malware-engine-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jb-engines-benchmark-${{ github.ref }}
  cancel-in-progress: true

jobs:
  benchmark:
    name: Benchmark all three engines
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22
          package-manager-cache: false
      - name: Cache npm download data
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-22-npm-${{ hashFiles('package.json') }}
          restore-keys: |
            ${{ runner.os }}-node-22-npm-
      - name: Install root dependencies without lifecycle scripts
        run: npm install --prefer-offline --ignore-scripts --no-audit --no-fund
      - name: Benchmark JB Expert QA
        env:
          EXPERT_QA_BENCH_ITERATIONS: "5"
          EXPERT_QA_BENCH_OUTPUT_DIR: benchmark-results/expert-qa
        run: node bench/expert-qa.js
      - name: Benchmark Security Guard
        env:
          BENCH_ITERATIONS: "10"
          BENCH_OUTPUT_DIR: benchmark-results/security-guard
        run: node bench/security-guard.js
      - name: Benchmark Malware Engine
        env:
          BENCH_ITERATIONS: "5"
          BENCH_OUTPUT_DIR: benchmark-results/malware-engine
        run: node packages/malware-engine/bench/run.js
      - name: Preview comparison with the permanent history
        run: node bench/record-engine-history.js --input benchmark-results --history bench/history/history.jsonl --preview
      - name: Upload benchmark reports
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: jb-engine-benchmarks-${{ github.run_id }}
          path: benchmark-results/
          if-no-files-found: error
          retention-days: 30

  persist-history:
    name: Persist benchmark history in Git
    needs: benchmark
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Checkout tested commit on the stable branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: true
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22
          package-manager-cache: false
      - name: Download benchmark reports
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: jb-engine-benchmarks-${{ github.run_id }}
          path: benchmark-results
      - name: Append permanent history and compare with the previous run
        run: node bench/record-engine-history.js --input benchmark-results --history bench/history/history.jsonl
      - name: Commit the append-only benchmark record
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bench/history/history.jsonl
          if git diff --cached --quiet; then
            echo "No new benchmark history record to commit."
          else
            git commit -m "chore(bench): record engine benchmark history"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
