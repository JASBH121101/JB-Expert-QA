name: Regression QA matrix

on:
  pull_request:
    branches: [main]
    paths:
      - "src/core/**"
      - "tests/core.test.js"
      - "tests/config.test.js"
      - "tests/redaction.test.js"
      - "tests/regression-matrix.test.js"
      - "tests/integration/**"
      - ".github/workflows/regression-matrix.yml"
  push:
    branches: [main]
    paths:
      - "src/core/**"
      - "tests/core.test.js"
      - "tests/config.test.js"
      - "tests/redaction.test.js"
      - "tests/regression-matrix.test.js"
      - "tests/integration/**"
      - ".github/workflows/regression-matrix.yml"

permissions:
  contents: read

concurrency:
  group: regression-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    name: Regression / ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
        node: [22, 24]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install chromium
      - name: Run deterministic core and fixture regressions
        run: >
          node --test
          tests/core.test.js
          tests/config.test.js
          tests/redaction.test.js
          tests/regression-matrix.test.js
          tests/integration/viewport-matrix.test.js
          tests/integration/visual-baseline.test.js
          tests/integration/interaction-baselines.test.js
