name: JB Threat Lab

on:
  pull_request:
    branches: [main]
    paths:
      - "packages/threat-lab/**"
      - "package.json"
      - ".github/workflows/threat-lab.yml"
      - "packages/expert-qa/**"
      - "packages/security-guard/**"
      - "packages/malware-engine/**"
      - "src/**"
      - "tests/**"
  push:
    branches: [main]
    paths:
      - "packages/threat-lab/**"
      - "package.json"
      - ".github/workflows/threat-lab.yml"
      - "packages/expert-qa/**"
      - "packages/security-guard/**"
      - "packages/malware-engine/**"
      - "src/**"
      - "tests/**"

permissions:
  contents: read

jobs:
  safe-lab-tests:
    name: Core engine regressions + Threat Lab (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Install workspace dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Expert QA regression suite
        run: npm run check
      - name: Security Guard regression suite
        run: npm run test:security-guard
      - name: Malware Engine regression suite
        run: npm --workspace @jb/malware-engine run check
      - name: Three-engine Threat Lab integration suite
        run: npm --workspace @jb/threat-lab run check
