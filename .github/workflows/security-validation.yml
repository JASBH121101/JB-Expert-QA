name: Security QA

on:
  push:
    branches: [main, "feature/**"]
    paths:
      - "package.json"
      - "src/**"
      - "tests/**"
      - "config/security-audit.config.json"
      - "config/security-url.config.json"
      - ".github/workflows/security-validation.yml"
  pull_request:
    branches: [main]
    paths:
      - "package.json"
      - "src/**"
      - "tests/**"
      - "config/security-audit.config.json"
      - ".github/workflows/security-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jb-security-qa
  cancel-in-progress: false

jobs:
  security-tests:
    name: Deterministic security-profile tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
          package-manager-cache: false
      - name: Validate JavaScript syntax
        run: |
          node --check src/specialists/security-rules.js
          node --check src/adapters/filesystem/audit-security-project.js
          node --check src/security-cli.js
          node --check src/specialists/runtime-security-rules.js
          node --check src/adapters/filesystem/audit-security-url.js
          node --check src/security-url-cli.js
      - name: Run security QA tests
        run: node --test tests/security-qa.test.js
