name: Security QA

on:
  push:
    branches: [main]
    paths:
      - "package.json"
      - "packages/**"
      - "src/**"
      - "tests/**"
      - ".githooks/**"
      - "scripts/**"
      - "config/security-audit.config.json"
      - "config/security-url.config.json"
      - ".github/workflows/security-validation.yml"
  pull_request:
    branches: [main]
    paths:
      - "package.json"
      - "packages/**"
      - "src/**"
      - "tests/**"
      - ".githooks/**"
      - "scripts/**"
      - "config/security-audit.config.json"
      - "config/security-url.config.json"
      - ".github/workflows/security-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jb-security-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security-tests:
    name: Deterministic security-profile tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: ${{ matrix.node-version }}
          package-manager-cache: false
      - name: Cache npm download data
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ matrix.node-version }}-npm-${{ hashFiles('package.json', 'packages/*/package.json') }}
          restore-keys: |
            ${{ runner.os }}-node-${{ matrix.node-version }}-npm-
      - name: Install dependencies without running package install scripts
        run: npm install --prefer-offline --ignore-scripts --no-audit --no-fund
      - name: Audit resolved dependency tree for high and critical vulnerabilities
        run: npm audit --audit-level=high
      - name: Generate CycloneDX software bill of materials
        run: npm sbom --sbom-format cyclonedx > security-sbom.cdx.json
      - name: Archive dependency SBOM
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: security-sbom-node-${{ matrix.node-version }}
          path: security-sbom.cdx.json
          if-no-files-found: error
          retention-days: 14
      - name: Validate JavaScript syntax
        run: |
          node --check src/specialists/security-rules.js
          node --check src/specialists/ast-security-rules.js
          node --check src/specialists/dead-code-rules.js
          node --check src/adapters/filesystem/audit-security-project.js
          node --check src/adapters/filesystem/audit-project.js
          node --check src/adapters/filesystem/reverify-project.js
          node --check src/core/reverification.js
          node --check packages/recommendation-engine/src/index.js
          node --check packages/recommendation-engine/tests/recommendation.test.js
          node --check src/specialists/project-rules.js
          node --check tests/project-audit.test.js
          node --check tests/reverification-workflow.test.js
          node --check src/security-cli.js
          node --check src/reverify-cli.js
          node --check src/specialists/runtime-security-rules.js
          node --check src/adapters/filesystem/audit-security-url.js
          node --check src/security-url-cli.js
          node --check packages/security-guard/src/index.js
          node --check packages/security-guard/src/auth-protection.js
          node --check packages/security-guard/src/account-recovery.js
          node --check packages/security-guard/src/security-headers.js
          node --check packages/security-guard/src/node-server-hardening.js
          node --check packages/security-guard/src/origin-protection.js
          node --check packages/security-guard/src/csrf-protection.js
          node --check packages/security-guard/src/distributed-rate-limit.js
          node --check packages/security-guard/src/distributed-auth-protection.js
          node --check packages/security-guard/src/upload-inspector.js
          node --check packages/malware-engine/src/index.js
          node --check packages/malware-engine/src/pe-analyzer.js
          node --check packages/malware-engine/src/archive-analyzer.js
          node --check packages/malware-engine/src/lnk-analyzer.js
          node --check packages/malware-engine/src/rtf-analyzer.js
          node --check packages/malware-engine/src/iso-analyzer.js
          node --check tests/csrf-protection.test.js
          node --check tests/distributed-rate-limit.test.js
          node --check tests/distributed-auth-protection.test.js
          node --check tests/origin-protection.test.js
          node --check tests/node-server-hardening.test.js
          node --check tests/security-headers.test.js
          node --check packages/security-guard/testing/recovery-adapters.js
          node --check tests/upload-inspector.test.js
          node --check bench/expert-qa.js
          node --check bench/record-engine-history.js
      - name: Run all engine and core test suites
        run: npm run test:all-engines
      - name: Run explicit phone and perfume recommendation tests
        run: npm run test:recommendation-engine
