name: Windows Job Object resource containment

on:
  pull_request:
    branches: [main]
    paths:
      - "src/agent/execution-process-runner.js"
      - "src/agent/windows-job-object-resource-controller.js"
      - "tests/execution-process-runner.test.js"
      - "tests/windows-job-object-resource-controller.test.js"
      - ".github/workflows/windows-job-object-containment.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-job-object-containment-${{ github.ref }}
  cancel-in-progress: true

jobs:
  job-object-lab:
    name: Native Windows Job Object lab / Node ${{ matrix.node-version }}
    runs-on: windows-2022
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444e
        with:
          node-version: ${{ matrix.node-version }}
          package-manager-cache: false
      - name: Run native Job Object integration and process-runner tests
        shell: pwsh
        run: |
          node --test tests/windows-job-object-resource-controller.test.js tests/execution-process-runner.test.js
