name: Publish JB npm packages

on:
  push:
    tags:
      - "npm-expert-qa-v*"
      - "npm-security-guard-v*"
      - "npm-malware-engine-v*"

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish-expert-qa:
    if: startsWith(github.ref, 'refs/tags/npm-expert-qa-v')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Install npm with Trusted Publishing support
        run: npm install --global npm@latest
      - name: Verify npm Trusted Publishing CLI version
        run: node -e "const v=require('child_process').execSync('npm --version',{encoding:'utf8'}).trim().split('.').map(Number); if(v[0]<11 || (v[0]===11 && v[1]<5) || (v[0]===11 && v[1]===5 && v[2]<1)) process.exit(1)"
      - name: Install Core dependency
        working-directory: packages/expert-qa
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Test Core package
        working-directory: packages/expert-qa
        run: npm test
      - name: Publish through npm Trusted Publishing (OIDC)
        run: npm publish ./packages/expert-qa --access public

  publish-security-guard:
    if: startsWith(github.ref, 'refs/tags/npm-security-guard-v')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Install npm with Trusted Publishing support
        run: npm install --global npm@latest
      - name: Verify npm Trusted Publishing CLI version
        run: node -e "const v=require('child_process').execSync('npm --version',{encoding:'utf8'}).trim().split('.').map(Number); if(v[0]<11 || (v[0]===11 && v[1]<5) || (v[0]===11 && v[1]===5 && v[2]<1)) process.exit(1)"
      - name: Test Security Guard package
        working-directory: packages/security-guard
        run: npm test
      - name: Publish through npm Trusted Publishing (OIDC)
        run: npm publish ./packages/security-guard --access public

  publish-malware-engine:
    if: startsWith(github.ref, 'refs/tags/npm-malware-engine-v')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Install npm with Trusted Publishing support
        run: npm install --global npm@latest
      - name: Verify npm Trusted Publishing CLI version
        run: node -e "const v=require('child_process').execSync('npm --version',{encoding:'utf8'}).trim().split('.').map(Number); if(v[0]<11 || (v[0]===11 && v[1]<5) || (v[0]===11 && v[1]===5 && v[2]<1)) process.exit(1)"
      - name: Test Malware Engine package
        working-directory: packages/malware-engine
        run: npm test
      - name: Publish through npm Trusted Publishing (OIDC)
        run: npm publish ./packages/malware-engine --access public
